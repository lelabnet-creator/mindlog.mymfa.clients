# myMFA servi en HTTP clair : le terminateur Caddy de la pile est l'unique
# terminaison TLS et le seul client de ce conteneur.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Derrière le terminateur, nginx ne connaît ni le schéma ni le port
    # publics : une redirection absolue partirait en `http://`.
    absolute_redirect off;
    port_in_redirect off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # ── En-têtes d'une app qui garde des secrets ──────────────────────────
    # Posés ICI et non dans le Caddyfile de la pile : ils appartiennent à
    # l'app, et doivent la suivre quel que soit le terminateur devant elle.
    #
    #   CSP              pour un coffre, un XSS équivaut à un vol total : la
    #                    CSP est le second rempart après l'écriture sans
    #                    innerHTML. `default-src 'none'` ferme tout ; seules
    #                    les origines réellement chargées sont rouvertes :
    #                    le client Google (accounts.google.com, chargé au
    #                    premier clic Drive) et l'API Drive
    #                    (www.googleapis.com, oauth2.googleapis.com pour la
    #                    révocation du jeton). Toute nouvelle dépendance
    #                    réseau ou tout nouveau script inline exigera de
    #                    faire évoluer cette liste — c'est le but.
    #   frame-ancestors  aucune page tierce ne peut l'encadrer — un code de
    #                    double authentification sous un calque invisible est
    #                    le scénario de détournement de clic par excellence ;
    #   no-referrer      rien de l'URL ne part chez Google au chargement de
    #                    son script de connexion (sauvegarde Drive) ;
    #   camera=(self)    la caméra du scanner, pour cette origine seulement.
    #
    # Dans `location` et non au niveau `server` : nginx ABANDONNE les
    # `add_header` hérités dès qu'un bloc en déclare un seul — ce que fait le
    # `Cache-Control` ci-dessous. Au niveau `server`, ils auraient disparu.
    location / {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://api.pwnedpasswords.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        # Aucun fichier empreinté : chaque ressource est revalidée (ETag),
        # sinon une mise à jour de l'app ne serait vue qu'à l'expiration d'un
        # cache.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # L'archive de l'extension : un téléchargement, pas une page.
    location = /dist/mymfa-extension.zip {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="mymfa-extension.zip"' always;
    }
}
