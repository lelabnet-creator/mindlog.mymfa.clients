<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="application-name" content="myMFA">
  <meta name="theme-color" content="#070B13">
  <title>myMFA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%23070B13'/%3E%3Cpath d='M5 23V14.5a5 5 0 0 1 10 0V23M15 14.5a5 5 0 0 1 10 0V23' fill='none' stroke='%235EE6CF' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script src="js/boot-theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Barre latérale (bureau) / navigation du bas (mobile) -->
    <aside class="sidebar">
      <a class="brand only-desktop" href="#/">
        <svg class="logo" width="34" height="25" viewBox="0 0 30 22" fill="none" aria-hidden="true"><defs><linearGradient id="logo-grad-side" x1="0" y1="0" x2="30" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8AF5E0"/><stop offset="1" stop-color="#2BB3C0"/></linearGradient></defs><path d="M3 19V10.5a5.75 5.75 0 0 1 11.5 0V19M14.5 10.5a5.75 5.75 0 0 1 11.5 0V19" stroke="url(#logo-grad-side)" stroke-width="4" stroke-linecap="round"/></svg>
        <span class="brand-name">my<b>MFA</b></span>
      </a>

      <nav class="nav" data-i18n-attr="aria-label:nav.main">
        <a href="#/" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill-active" d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6z"/></svg>
          <span data-i18n="nav.home"></span>
        </a>
        <a href="#/scan" data-nav="scan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"/></svg>
          <span data-i18n="nav.scan"></span>
        </a>
        <a href="#/passwords" data-nav="passwords">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7a4 4 0 1 1-3.9 4.9L4 19v2h3v-2h2v-2h2l1.1-1.1A4 4 0 0 1 15 7z"/><path d="M16 9h.01"/></svg>
          <span data-i18n="nav.passwords"></span>
        </a>
        <a href="#/dashboard" data-nav="dashboard" class="only-desktop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span data-i18n="nav.dashboard"></span>
        </a>
        <a href="#/activity" data-nav="activity">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span data-i18n="nav.activity"></span>
        </a>
        <a href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span data-i18n="nav.settings"></span>
        </a>
      </nav>

      <div class="sidebar-ext only-desktop" id="sidebar-ext" hidden>
        <span class="sidebar-ext-label" data-i18n="sidebar.extension"></span>
        <span class="sidebar-ext-text" id="sidebar-ext-text"></span>
      </div>
      <button type="button" class="sidebar-lock only-desktop" id="btn-lock-side" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span data-i18n="lock.lockNow"></span>
      </button>
      <a class="sidebar-warning only-desktop" id="sidebar-warning" href="#/settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span data-i18n="sidebar.insecure"></span>
      </a>
    </aside>

    <main class="main">
      <p class="banner" id="insecure-banner" role="alert" data-i18n="banner.insecure" hidden></p>

      <!-- ═════════════ Accueil ═════════════ -->
      <section class="view view-home" data-view="home">
        <header class="home-head">
          <button type="button" class="icon-btn only-mobile" id="btn-search-toggle" aria-expanded="false" aria-controls="search-wrap" data-i18n-attr="aria-label:home.searchToggle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <div class="brand brand-inline only-mobile">
            <svg class="logo" width="30" height="22" viewBox="0 0 30 22" fill="none" aria-hidden="true"><defs><linearGradient id="logo-grad-head" x1="0" y1="0" x2="30" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8AF5E0"/><stop offset="1" stop-color="#2BB3C0"/></linearGradient></defs><path d="M3 19V10.5a5.75 5.75 0 0 1 11.5 0V19M14.5 10.5a5.75 5.75 0 0 1 11.5 0V19" stroke="url(#logo-grad-head)" stroke-width="4" stroke-linecap="round"/></svg>
            <span class="brand-name">my<b>MFA</b></span>
          </div>
          <h1 class="page-title only-desktop" data-i18n="home.title"></h1>
          <label class="search" id="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="search" autocomplete="off" data-i18n-attr="placeholder:home.search;aria-label:home.search">
          </label>
          <div class="head-end">
          <div class="theme-quick only-desktop" role="radiogroup" id="theme-quick" data-i18n-attr="aria-label:theme.group">
            <button type="button" role="radio" data-theme-value="auto" data-i18n-attr="aria-label:theme.autoTitle;title:theme.autoTitle">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill-current"/></svg>
            </button>
            <button type="button" role="radio" data-theme-value="light" data-i18n-attr="aria-label:theme.lightTitle;title:theme.lightTitle">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" role="radio" data-theme-value="dark" data-i18n-attr="aria-label:theme.darkTitle;title:theme.darkTitle">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            </button>
          </div>
          <button type="button" class="icon-btn boxed" id="btn-lock" hidden data-i18n-attr="aria-label:lock.lockNow;title:lock.lockNow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </button>
          <a href="#/scan" class="fab only-mobile" data-i18n-attr="aria-label:home.addAria">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </a>
          <a href="#/scan" class="btn btn-primary only-desktop">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="home.add"></span>
          </a>
          </div>
        </header>

        <div class="chips" id="filters" role="group" data-i18n-attr="aria-label:home.filters"></div>

        <ul class="cards" id="accounts"></ul>

        <div class="empty-state" id="first-run" hidden>
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/></svg>
          </div>
          <h2 data-i18n="home.emptyTitle"></h2>
          <p data-i18n="home.emptyText"></p>
          <a href="#/scan" class="btn btn-primary" data-i18n="home.emptyCta"></a>
        </div>
        <p class="empty" id="accounts-empty" hidden></p>
      </section>

      <!-- ═════════════ Scanner ═════════════ -->
      <section class="view view-narrow view-scan" data-view="scan" hidden>
        <header class="sub-head sub-head-end">
          <a href="#/" class="icon-btn round" data-i18n-attr="aria-label:scan.close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </a>
        </header>
        <div class="scan-intro">
          <div class="intro-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/><path d="M13 7h4v2M7 17v-2h2"/></svg>
          </div>
          <h1 data-i18n="scan.title"></h1>
          <p data-i18n="scan.subtitle"></p>
        </div>

        <div class="viewfinder" id="viewfinder">
          <video id="camera" playsinline muted data-i18n-attr="aria-label:scan.preview"></video>
          <div class="vf-idle" id="vf-idle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-camera" data-i18n="scan.enableCamera"></button>
          </div>
          <span class="vf-line" aria-hidden="true"></span>
          <span class="vf-corner tl" aria-hidden="true"></span>
          <span class="vf-corner tr" aria-hidden="true"></span>
          <span class="vf-corner bl" aria-hidden="true"></span>
          <span class="vf-corner br" aria-hidden="true"></span>
        </div>
        <p class="scan-status" id="scan-status" role="status"></p>

        <div class="scan-actions">
          <button type="button" class="btn btn-surface" id="btn-pick-image">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
            <span data-i18n="scan.importImage"></span>
          </button>
          <button type="button" class="btn btn-surface" id="btn-paste">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
            <span data-i18n="scan.paste"></span>
          </button>
        </div>
        <input type="file" id="qr-file" accept="image/*" hidden>
        <a href="#/new" class="pill-link" id="link-manual">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M17 6l2 2M15 8l2 2"/></svg>
          <span data-i18n="scan.manual"></span>
        </a>
        <p class="scan-help" data-i18n="scan.help"></p>
      </section>

      <!-- ═════════════ Nouveau compte ═════════════ -->
      <section class="view view-narrow view-new" data-view="new" hidden>
        <header class="sub-head">
          <a href="#/scan" class="icon-btn round" data-i18n-attr="aria-label:new.back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </a>
          <span class="sub-title" data-i18n="new.title"></span>
        </header>

        <div class="new-hero" id="new-hero" hidden>
          <div class="check-ring">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
          </div>
          <h1 id="new-hero-title"></h1>
          <p data-i18n="new.recognizedText"></p>
        </div>

        <form id="add-form" class="new-form" autocomplete="off" novalidate>
          <div class="field" id="secret-field">
            <label for="f-secret" class="field-label" data-i18n="field.secret"></label>
            <input id="f-secret" name="secret" class="input input-mono" spellcheck="false" autocapitalize="characters" autocorrect="off" data-i18n-attr="placeholder:field.secretPlaceholder">
          </div>

          <div class="group">
            <div class="group-row">
              <span class="tile" id="new-tile" aria-hidden="true"></span>
              <div class="group-field">
                <label for="f-issuer" data-i18n="field.issuer"></label>
                <input id="f-issuer" name="issuer" data-i18n-attr="placeholder:field.issuerPlaceholder">
              </div>
            </div>
            <div class="group-row group-row-indent">
              <div class="group-field">
                <label for="f-account" data-i18n="field.account"></label>
                <input id="f-account" name="account" autocapitalize="off" data-i18n-attr="placeholder:field.accountPlaceholder">
              </div>
            </div>
          </div>

          <fieldset class="tag-picker">
            <legend class="section-label" data-i18n="field.tag"></legend>
            <div class="chips chips-wrap" id="tag-chips"></div>
            <input id="f-tag-new" class="input" autocapitalize="off" hidden data-i18n-attr="placeholder:field.newTagPlaceholder;aria-label:field.newTagPlaceholder">
          </fieldset>

          <div class="field">
            <label for="f-description" class="section-label" data-i18n="field.description"></label>
            <textarea id="f-description" name="description" class="input" rows="2" data-i18n-attr="placeholder:field.descriptionPlaceholder"></textarea>
          </div>

          <div class="code-preview" id="code-preview" hidden>
            <div class="code-preview-text">
              <span class="section-label accent" data-i18n="new.currentCode"></span>
              <span class="code-preview-value" id="preview-code"></span>
              <span class="code-preview-hint" id="preview-hint"></span>
            </div>
            <div class="ring" id="preview-ring" role="img">
              <svg viewBox="0 0 46 46" aria-hidden="true"><circle class="ring-track" cx="23" cy="23" r="19"/><circle class="ring-value" cx="23" cy="23" r="19"/></svg>
              <span class="ring-secs"></span>
            </div>
          </div>

          <details class="advanced" id="advanced">
            <summary><span id="params-summary"></span><span class="advanced-toggle" data-i18n="field.advanced"></span></summary>
            <div class="advanced-grid">
              <label class="field-label">
                <span data-i18n="field.type"></span>
                <select id="f-type" name="type" class="input">
                  <option value="totp" data-i18n="field.typeTotp"></option>
                  <option value="hotp" data-i18n="field.typeHotp"></option>
                </select>
              </label>
              <label class="field-label">
                <span data-i18n="field.algorithm"></span>
                <select id="f-algorithm" name="algorithm" class="input"><option>SHA1</option><option>SHA256</option><option>SHA512</option></select>
              </label>
              <label class="field-label">
                <span data-i18n="field.digits"></span>
                <select id="f-digits" name="digits" class="input"><option>6</option><option>7</option><option>8</option></select>
              </label>
              <label class="field-label" data-for-type="totp">
                <span data-i18n="field.period"></span>
                <input id="f-period" name="period" class="input" type="number" inputmode="numeric" min="1" value="30">
              </label>
              <label class="field-label" data-for-type="hotp" hidden>
                <span data-i18n="field.counter"></span>
                <input id="f-counter" name="counter" class="input" type="number" inputmode="numeric" min="0" value="0">
              </label>
            </div>
          </details>

          <p class="form-error" id="add-error" role="alert" hidden></p>

          <div class="form-foot">
            <button type="submit" class="btn btn-primary btn-block btn-lg">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
              <span data-i18n="new.submit"></span>
            </button>
          </div>
        </form>
      </section>

      <!-- ═════════════ Activité ═════════════ -->
      <section class="view view-narrow view-activity" data-view="activity" hidden>
        <header class="page-head">
          <div>
            <h1 data-i18n="activity.title"></h1>
            <p class="page-sub" data-i18n="activity.subtitle"></p>
          </div>
          <a href="#/dashboard" class="icon-btn boxed only-mobile" data-i18n-attr="aria-label:nav.dashboard;title:nav.dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          </a>
          <button type="button" class="icon-btn boxed danger" id="btn-clear-history" data-i18n-attr="aria-label:activity.clear;title:activity.clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </header>
        <div class="chips" id="activity-filters" role="group" data-i18n-attr="aria-label:activity.filters"></div>
        <div class="activity" id="activity"></div>
        <p class="empty" id="activity-empty" data-i18n="activity.empty" hidden></p>
      </section>

      <!-- ═════════════ Tableau de bord ═════════════ -->
      <section class="view view-dashboard" data-view="dashboard" hidden>
        <header class="page-head">
          <div>
            <h1 data-i18n="dashboard.title"></h1>
            <p class="page-sub" data-i18n="dashboard.subtitle"></p>
          </div>
        </header>
        <div class="dashboard" id="dashboard"></div>
      </section>

      <!-- ═════════════ Mots de passe et passkeys ═════════════ -->
      <section class="view view-passwords" id="view-passwords" data-view="passwords" hidden>
        <header class="page-head cred-head">
          <div class="cred-head-text">
            <h1 data-i18n="credentials.title"></h1>
            <p class="page-sub" data-i18n="credentials.subtitle"></p>
          </div>
          <button type="button" class="btn btn-ghost only-desktop" id="btn-generate">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
            <span data-i18n="credentials.generate"></span>
          </button>
          <button type="button" class="icon-btn boxed only-mobile" id="btn-generate-m" data-i18n-attr="aria-label:credentials.generateTitle;title:credentials.generateTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
          </button>
          <button type="button" class="btn btn-primary only-desktop" id="btn-add-login">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="credentials.addShort"></span>
          </button>
        </header>
        <div class="panel cred-plain" id="cred-plain" hidden>
          <p data-i18n="credentials.plainText"></p>
          <button type="button" class="btn btn-primary" id="btn-cred-enable" data-i18n="drive.enablePassword"></button>
        </div>
        <div class="cred-content" id="cred-content">
          <div class="cred-toolbar">
            <label class="search cred-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="cred-search" data-i18n-attr="placeholder:credentials.search;aria-label:credentials.search">
            </label>
            <div class="cred-tabs" role="tablist" id="cred-tabs" data-i18n-attr="aria-label:credentials.show">
              <button type="button" role="tab" data-filter="all"><span data-i18n="credentials.tabAll"></span> <span class="tab-count" id="count-all"></span></button>
              <button type="button" role="tab" data-filter="logins"><span data-i18n="credentials.tabLogins"></span> <span class="tab-count" id="count-logins"></span></button>
              <button type="button" role="tab" data-filter="passkeys"><span data-i18n="credentials.tabPasskeys"></span> <span class="tab-count" id="count-passkeys"></span></button>
            </div>
          </div>
          <div class="cred-layout">
            <div class="cred-list-pane" id="cred-list"></div>
            <section class="panel cred-detail" id="cred-detail" aria-live="polite" hidden></section>
          </div>
        </div>
        <button type="button" class="fab cred-fab only-mobile" id="btn-add-login-fab" data-i18n-attr="aria-label:credentials.addTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </section>

      <!-- ═════════════ Réglages ═════════════ -->
      <section class="view view-narrow view-settings" data-view="settings" hidden>
        <header class="page-head">
          <h1 data-i18n="settings.title"></h1>
        </header>

        <section class="settings-section" aria-labelledby="s-appearance">
          <h2 class="section-label" id="s-appearance" data-i18n="settings.appearance"></h2>
          <div class="panel">
            <div class="theme-cards" role="radiogroup" id="theme-cards" data-i18n-attr="aria-label:theme.group">
              <button type="button" role="radio" data-theme-value="auto">
                <span class="theme-preview preview-auto" aria-hidden="true"><span></span><span></span></span>
                <span data-i18n="theme.auto"></span>
              </button>
              <button type="button" role="radio" data-theme-value="light">
                <span class="theme-preview preview-light" aria-hidden="true"><span></span><span></span></span>
                <span data-i18n="theme.light"></span>
              </button>
              <button type="button" role="radio" data-theme-value="dark">
                <span class="theme-preview preview-dark" aria-hidden="true"><span></span><span></span></span>
                <span data-i18n="theme.dark"></span>
              </button>
            </div>
            <p class="panel-hint" id="theme-hint"></p>
          </div>
          <div class="panel panel-list">
            <label class="row">
              <span class="row-main" data-i18n="settings.language"></span>
              <select id="lang" class="row-select"></select>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="s-security">
          <h2 class="section-label" id="s-security" data-i18n="settings.security"></h2>
          <div class="panel panel-list" id="security-rows"></div>
          <div class="panel panel-list">
            <div class="row row-tall">
              <span class="row-main">
                <span id="lbl-hide" data-i18n="settings.hideCodes"></span>
                <small data-i18n="settings.hideCodesText"></small>
              </span>
              <button type="button" class="switch" role="switch" id="switch-hide" aria-checked="false" aria-labelledby="lbl-hide"><span></span></button>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="s-passkeys" id="passkeys-section" hidden>
          <h2 class="section-label" id="s-passkeys" data-i18n="security.passkeys"></h2>
          <div class="panel panel-list" id="passkeys-list"></div>
          <p class="panel-hint" id="passkeys-note"></p>
        </section>

        <section class="settings-section" aria-labelledby="s-data">
          <h2 class="section-label" id="s-data" data-i18n="settings.data"></h2>
          <div class="panel panel-list">
            <button type="button" class="row" id="btn-export-vault" hidden>
              <svg class="row-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
              <span class="row-main" data-i18n="settings.exportVault"></span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <button type="button" class="row" id="btn-export">
              <svg class="row-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
              <span class="row-main" data-i18n="settings.export"></span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <label class="row" for="import-file" tabindex="0">
              <svg class="row-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
              <span class="row-main">
                <span data-i18n="settings.import"></span>
                <small data-i18n="settings.importText"></small>
              </span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </label>
            <input type="file" id="import-file" accept="application/json,.json,text/csv,.csv" hidden>
            <div class="import-progress" id="import-progress" hidden>
              <div class="import-progress-top">
                <span id="import-progress-text"></span>
                <span class="import-progress-count" id="import-progress-count"></span>
              </div>
              <progress id="import-progress-bar" aria-labelledby="import-progress-text"></progress>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="s-drive">
          <h2 class="section-label" id="s-drive" data-i18n="drive.title"></h2>
          <div class="panel drive-card" id="drive-card">
            <div class="extension-text">
              <span class="row-icon accent" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4.5 4.5 0 0 1-.5 9.5z"/><path d="M12 11v6M9.5 13.5 12 11l2.5 2.5"/></svg></span>
              <div class="drive-text">
                <p class="drive-status" id="drive-status"></p>
                <p class="panel-hint" id="drive-hint"></p>
              </div>
            </div>
            <form class="drive-setup" id="drive-setup" hidden novalidate>
              <label class="field-label">
                <span data-i18n="drive.clientIdLabel"></span>
                <input class="input input-mono" id="drive-client-id" name="clientId" autocomplete="off" spellcheck="false" placeholder="123456789-abc.apps.googleusercontent.com">
              </label>
              <p class="panel-hint" id="drive-origin"></p>
              <div class="drive-actions">
                <button type="submit" class="btn btn-primary" data-i18n="drive.saveClientId"></button>
                <a class="btn btn-ghost" href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener" data-i18n="drive.openConsole"></a>
              </div>
            </form>
            <div class="drive-actions" id="drive-actions">
              <button type="button" class="btn btn-primary" id="btn-drive-backup" data-i18n="drive.backup"></button>
              <button type="button" class="btn btn-primary" id="btn-drive-enable" data-i18n="drive.enablePassword" hidden></button>
              <button type="button" class="btn btn-ghost" id="btn-drive-restore" data-i18n="drive.restore"></button>
              <button type="button" class="btn btn-ghost" id="btn-drive-undo" data-i18n="drive.undoRestore" hidden></button>
              <button type="button" class="btn btn-ghost" id="btn-drive-edit" data-i18n="drive.editClientId" hidden></button>
            </div>
            <label class="drive-every" id="drive-every-row" hidden>
              <span>
                <span data-i18n="drive.every"></span>
                <small id="drive-next"></small>
              </span>
              <select id="drive-every" class="select-inline"></select>
            </label>
            <div class="confirm" id="drive-confirm" hidden>
              <p id="drive-confirm-text"></p>
              <div class="dialog-actions">
                <span class="spacer"></span>
                <button type="button" class="btn btn-ghost" id="btn-drive-cancel" data-i18n="drive.cancel"></button>
                <button type="button" class="btn btn-danger" id="btn-drive-replace" data-i18n="drive.replace"></button>
              </div>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="s-extension">
          <h2 class="section-label" id="s-extension" data-i18n="settings.extension"></h2>
          <div class="panel extension-card">
            <div class="extension-text">
              <span class="row-icon accent" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 4a2 2 0 0 1 4 0v2h4a1 1 0 0 1 1 1v4h-2a2 2 0 0 0 0 4h2v4a1 1 0 0 1-1 1h-4v-2a2 2 0 0 0-4 0v2H5a1 1 0 0 1-1-1v-4h2a2 2 0 0 0 0-4H4V7a1 1 0 0 1 1-1h4z"/></svg></span>
              <p data-i18n="settings.extensionText"></p>
            </div>
            <a href="extension.html" class="btn btn-primary btn-block">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
              <span data-i18n="settings.extensionInstall"></span>
            </a>
          </div>
        </section>

        <p class="settings-foot" id="settings-foot"></p>
      </section>
    </main>
  </div>

  <!-- Écran de verrouillage -->
  <div class="lock-screen" id="lock-screen" hidden>
    <form class="lock-card" id="lock-form" autocomplete="on">
      <svg class="logo" width="44" height="32" viewBox="0 0 30 22" fill="none" aria-hidden="true"><defs><linearGradient id="logo-grad-lock" x1="0" y1="0" x2="30" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8AF5E0"/><stop offset="1" stop-color="#2BB3C0"/></linearGradient></defs><path d="M3 19V10.5a5.75 5.75 0 0 1 11.5 0V19M14.5 10.5a5.75 5.75 0 0 1 11.5 0V19" stroke="url(#logo-grad-lock)" stroke-width="4" stroke-linecap="round"/></svg>
      <h1 data-i18n="lock.title"></h1>
      <p class="lock-text" data-i18n="lock.text"></p>
      <input type="text" name="username" value="myMFA" autocomplete="username" hidden aria-hidden="true" tabindex="-1">
      <label class="field-label">
        <span data-i18n="lock.password"></span>
        <input type="password" id="lock-password" class="input" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="lock-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0"/></svg>
        <span data-i18n="lock.unlock"></span>
      </button>
      <button type="button" class="btn btn-ghost btn-block btn-lg" id="lock-passkey" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M17 6l2 2M15 8l2 2"/></svg>
        <span data-i18n="lock.passkey"></span>
      </button>
      <button type="button" class="link-btn" id="lock-forgot" data-i18n="lock.forgot"></button>
    </form>
  </div>

  <dialog id="login-dialog" aria-labelledby="login-title">
    <form id="login-form" class="edit-form" novalidate></form>
  </dialog>

  <dialog id="security-dialog" aria-labelledby="security-title">
    <form id="security-form" class="edit-form" novalidate></form>
  </dialog>

  <!-- Modèle d'une carte de compte -->
  <template id="tpl-card">
    <li class="card">
      <button type="button" class="tile-btn" data-action="edit"><span class="tile"></span></button>
      <div class="card-body">
        <button type="button" class="card-name" data-action="edit">
          <span class="card-issuer"></span>
          <span class="card-account"></span>
        </button>
        <button type="button" class="code" data-action="code"></button>
        <p class="card-desc" hidden></p>
      </div>
      <div class="card-side">
        <div class="card-actions">
          <button type="button" class="icon-btn small star" data-action="fav">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
          </button>
          <button type="button" class="icon-btn small" data-action="copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
        </div>
        <div class="ring" role="img">
          <svg viewBox="0 0 46 46" aria-hidden="true"><circle class="ring-track" cx="23" cy="23" r="19"/><circle class="ring-value" cx="23" cy="23" r="19"/></svg>
          <span class="ring-secs"></span>
        </div>
        <button type="button" class="next-btn" data-action="next" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
    </li>
  </template>

  <!-- Édition -->
  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form method="dialog" id="edit-form" class="edit-form">
      <h2 id="edit-title" data-i18n="edit.title"></h2>
      <label class="field-label"><span data-i18n="field.issuer"></span><input name="issuer" class="input"></label>
      <label class="field-label"><span data-i18n="field.account"></span><input name="account" class="input" autocapitalize="off"></label>
      <label class="field-label"><span data-i18n="field.tag"></span><input name="tag" class="input" list="tag-list" autocapitalize="off"></label>
      <datalist id="tag-list"></datalist>
      <label class="field-label"><span data-i18n="field.description"></span><textarea name="description" class="input" rows="3"></textarea></label>
      <details class="advanced">
        <summary><span data-i18n="edit.secret"></span></summary>
        <p class="secret-reveal"><code id="e-secret"></code></p>
        <p class="muted small"><span data-i18n="edit.uri"></span> <code id="e-uri"></code></p>
      </details>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost danger" id="btn-delete" data-i18n="edit.delete"></button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" id="btn-cancel-edit" data-i18n="edit.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="edit.save"></button>
      </div>
      <div class="confirm" id="delete-confirm" hidden>
        <p data-i18n="edit.confirmDelete"></p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" id="btn-delete-no" data-i18n="edit.confirmNo"></button>
          <button type="button" class="btn btn-danger" id="btn-delete-yes" data-i18n="edit.confirmYes"></button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/jsQR.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/locales/fr.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/otp.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/sync2.js"></script>
  <script src="js/heure.js"></script>
  <script src="js/config.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/credentials.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
