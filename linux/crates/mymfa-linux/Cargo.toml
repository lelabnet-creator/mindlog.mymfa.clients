[package]
name = "mymfa-linux"
description = "Démon et CLI myMFA pour Linux : trousseau du bureau (Secret Service), codes et logins du coffre, interface D-Bus pour hyprdesk"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mymfa"
path = "src/main.rs"

[dependencies]
mymfa-core = { workspace = true }
mymfa-sceau = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
getrandom = { workspace = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
# Session Secret Service chiffrée : dh-ietf1024-sha256-aes128-cbc-pkcs7.
num-bigint = "0.4"
hkdf = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
futures-util = { version = "0.3", default-features = false }
# Drapeaux de RequestName (le défaut de zbus inclut DoNotQueue : on veut la file).
enumflags2 = "0.7"
