[package]
name = "mymfa-core"
description = "Cœur myMFA : OTP, coffre chiffré, fusion et modèles — compatibles octet pour octet avec l'app web (../web/js)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Textes FR/EN générés depuis web/js/locales (`npm run gen`) : l'app Android
# en a besoin, le client Linux (../../../linux) non — il s'en passe, et se
# construit sans Node.
default = ["texts"]
texts = []
# Sonde NTS (SYN-08, RFC 8915 vers time.cloudflare.com) : le démon Linux
# l'active ; le cœur reste léger pour Android sans elle.
nts = ["dep:rkik-nts"]

[dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
hkdf = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = "0.1"
url = "2"
getrandom = "0.3"
rkik-nts = { version = "1.4", optional = true }

# Piloter la sonde NTS dans les tests (feature nts) : jamais dans la bibliothèque.
[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
