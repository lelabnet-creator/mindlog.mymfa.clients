[workspace]
resolver = "2"
members = ["crates/mymfa-core", "crates/mymfa-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
